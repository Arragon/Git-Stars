name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (ADR-0007 D4)
        run: npm run format:check

      - name: TypeScript check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API contract check (ADR-0006 D7)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            if git cat-file -e "origin/$BASE_REF:server/openapi.yaml" 2>/dev/null; then
              git show "origin/$BASE_REF:server/openapi.yaml" > /tmp/openapi.base.yaml
              OPENAPI_BASE=/tmp/openapi.base.yaml npm run api:check
            else
              echo "No committed openapi.yaml on $BASE_REF yet — validation only."
              npm run api:check
            fi
          else
            npm run api:check
          fi

      - name: Production build
        run: npm run build

      # Known deviation from ADR-0007 D4 (documented for follow-up):
      # - schema-breaking gate: requires a committed schema baseline file. Follow-up:
      #   compare SQLite schema dumps between commits (INH-319 / INH-494).
