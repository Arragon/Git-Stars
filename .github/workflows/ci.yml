name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Lint
        # main has 17 existing lint errors; remove this after PHASE E2 clears them.
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
