function hub(){const items=[...catalogs,...lists.filter(l=>l.published&&l.hub&&state.publicSnapshots[l.id]).map(l=>({id:'own-'+l.id,title:state.publicSnapshots[l.id].title,description:state.publicSnapshots[l.id].description,items:state.publicSnapshots[l.id].items,tone:l.tone,date:'10月02日'}))].filter(c=>(c.title+' '+c.description).toLowerCase().includes(state.hubQuery.toLowerCase())).sort((a,b)=>state.hubSort==='title'?a.title.localeCompare(b.title,'zh-CN'):a.id.localeCompare(b.id,undefined,{numeric:true}));let body=pageHead('Hub 广场','发现他人公开分享的开源清单，整理成自己的工具箱。');body+=`<div class="toolbar mb16"><div class="search-field">${ic('search')}<input class="field" data-bind="hubQuery" value="${esc(state.hubQuery)}" placeholder="搜索公开列表" aria-label="搜索公开列表"></div><select class="field" aria-label="公开列表排序" data-bind="hubSort"><option value="recent" ${state.hubSort==='recent'?'selected':''}>最近更新</option><option value="title" ${state.hubSort==='title'?'selected':''}>名称排序</option></select></div>`;if(state.scene==='empty')return body+emptyView('这里还没有公开列表','你可以先整理自己的列表。发布分享快照后，再选择是否展示到 Hub。',button('整理我的列表','folder','nav','data-target="#lists"','primary'),'compass');if(state.offline)return body+emptyView('公开列表需要联网查看','收藏库中的本地内容仍然可以访问。恢复连接后再来发现新的清单。',button('返回收藏库','library','nav','data-target="#library"','primary'),'wifiOff');if(sceneView('hub'))return body+sceneView('hub');if(!items.length)return body+emptyView('没有找到这个主题','换一个关键词，或查看全部公开列表。',button('清除搜索','','clear-hub-query','','primary'),'search');return body+`<div class="results-line"><span>${items.length} 个公开列表</span><span>仅包含主动公开到 Hub 的快照</span></div><div class="hub-grid">${items.map(c=>`<article class="hub-card"><div class="hub-card-top"><span class="hub-mark ${c.tone}">${ic('folder','large')}</span>${badge('公开','','globe')}</div><h2><a href="#s/${c.id}">${esc(c.title)}</a></h2><p>${esc(c.description)}</p><div class="hub-meta"><span class="number">${c.items.length} 个仓库</span><span>${c.date} 更新</span></div><div class="hub-actions function providerSettings(){return `<div class="settings-section"><h2>平台连接</h2><p>代码托管平台的授权与同步状态。</p><div class="provider-row"><span class="provider-symbol">${ic('github','large')}</span><div class="grow"><div class="row gap8"><h3>GitHub</h3>${badge(state.providerConnected?'已连接':'未连接',state.providerConnected?'green':'')}</div><p class="muted small mt8">demo-user · github.com</p></div>${button(state.providerConnected?'解除连接':'重新连接',state.providerConnected?'':'github',state.providerConnected?'revoke-provider':'connect-provider',offlineAttrs(),state.providerConnected?'sm':'primary sm')}</div>${['GitLab','Gitee'].map(p=>`<div class="provider-row"><span class="provider-symbol">${ic('code')}</span><div class="grow"><h3>${p}</h3><p class="muted small mt8">当前版本尚未开放真实连接。</p></div>${badge('尚未支持')}</div>`).join('')}</div><div class="settings-section"><h3>同步你的收藏</h3><p>GitHub 同步会拉取该平台的 Star 与 Fork。整理到 GitStars 的列表与个人备注由 GitStars 管理。</p><div class="form-actions"><span class="small">${state.offline?'离线：等待恢复连接':'上次同步 · 2 分钟前'}</span>${button('同步 GitHub','sync','sync-now',`${offlineAttrs()} ${!state.providerConnected?'disabled':''}`,'primary')}</div></div>`}

function readmeContent(r){return `<article class="readme"><div class="doc-label"><span class="row gap8">${ic('book','small')}README.md</span>${button('复制示例代码','copy','copy-snippet','','ghost sm')}</div><h1>${esc(r.name)}</h1><p>${esc(r.description)}</p><div class="row wrap mt16">${badge(r.language,'blue')}${badge('开源工具','green')}${badge('README 示范内容')}</div><h2 id="overview">概览</h2><p>${esc(r.summary||r.description)} 这个阅读界面将原始说明、个人整理和必要的仓库信息放在同一个工作空间。</p><p>左侧专注阅读，右侧保留你对这个项目的摘要、标签与备注。返回收藏库时，之前的搜索条件仍然保留。</p><h2 id="quickstart">快速开始</h2><p>下面的代码是合成示例，用于查看代码块、复制按钮与长内容的阅读效果。</p><pre><code>${esc(r.id==='r1'?"import { Hono } from 'hono'\n\nconst app = new Hono()\n\napp.get('/', (c) => {\n  return c.json({ message: 'Hello GitStars' })\n})\n\nexport default app":"# 示例工作流\n# 安装、配置与启动步骤请以仓库原始说明为准。\nproject --help")}</code></pre><h2 id="usage">什么时候用它</h2><p>当你需要解决对应的开发或研究问题时，先检查仓库的文档、维护状态与支持范围，再用一个小项目验证是否适合自己的工作流。</p><ul><li>查看当前版本的使用说明和运行要求。</li><li>记录与你的项目有关的限制或待验证问题。</li><li>把相关工具放进同一主题的列表，方便下次查找。</li></ul><h2 id="resources">继续阅读</h2><p><a href="https://github.com/${esc(r.owner+'/'+r.name)}" target="_blank" rel="noopener noreferrer">在 GitHub 查看原始仓库 ${ic('external','small')}</a></p><div class="rule mt24" style="padding-top:16px"><p class="tiny">此处正文、版本、统计均为演示内容；外部来源链接由你主动点击后打开。</p></div></article>`}

if(sceneView('reader'))return body+sceneView('reader');return body+`<div class="reader-layout"><section id="reader-content" role="tabpanel" aria-labelledby="tab-${state.readerTab}" tabindex="0">${state.offline?emptyView('这部分内容尚未缓存','离线时可查看已缓存的仓库资料、摘要、标签与备注。README、文件和发布资料需要联网获取。',button('返回收藏库','back','nav','data-target="#library"','primary'),'wifiOff'):state.readerTab==='readme'?readmeContent(r):state.readerTab==='files'?filesContent():releasesContent(r)}</section><aside class="reader-aside"><section class="aside-section"><div class="row between mb16"><h3 style="margin:0;color:var(--violet)">${ic('ai','small')}AI 摘要</h3>${iconButton('重新生成摘要','sync','ai-repo',`data-id="${r.id}" ${offlineAttrs()}`,'ghost sm')}</div><p class="ai-copy">${esc(r.summary||'还没有摘要，可以按需生成。')}</p><div class="row wrap mt16">${r.tags.map(t=>badge(t,'violet')).join('')}</div></section><section class="aside-section"><h3>${ic('note','small')}个人备注</h3><textarea class="field" aria-label="个人备注" data-note="${r.id}" placeholder="记录你的使用场景、待验证问题…">${esc(r.note)}</textarea><div class="save-state" id="note-save-status">${ic('check','small')}${state.offline?'编辑后保存在本地，等待同步':'停止输入后自动保存到演示会话'}</div></section><section class="aside-section"><h3>${ic('tag','small')}手动标签</h3><div class="row wrap">${r.manualTags.map(t=>`<button class="chip active" data-action="remove-manual-tag" data-id="${r.id}" data-value="${esc(t)}" aria-label="移除手动标签 ${esc(t)}">${esc(t)}${ic('close','small')}</button>`).join('')}${button('添加标签','plus','add-tag',`data-id="${r.id}"`,'ghost sm')}</div></section><section class="aside-section"><h3>仓库资料</h3><div class="repo-facts"><div><span>平台</span><span class="row gap8">${ic('github','small')}GitHub</span></div><div><span>主要语言</span><span>${r.language}</span></div><div><span>Stars</span><span class="number">${totalText(r.stars)}</span></div><div><span>Forks</span><span class="number">${totalText(r.forks)}</span></div><div><span>可见性</span><span>${r.private?'私有':'公开'}</span></div><div><span>活跃度</span>${badge(r.activity,r.activity==='活跃'?'green':'')}</div></div><p class="tiny muted mt16">统计与活跃度为演示值。</p></section>${state.readerTab==='readme'&&!state.offline?`<nav class="aside-section toc" aria-label="README 目录"><h3>本页目录</h3><a href="#overview" data-action="scroll-section" data-value="overview">概览</a><a href="#quickstart" data-action="scroll-section" data-value="quickstart">快速开始</a><a href="#usage" data-action="scroll-section" data-value="usage">什么时候用它</a><a href="#resources" data-action="scroll-section" data-value="resources">继续阅读</a></nav>`:''}</aside></div>`}
function publicList(){let c=catalogs.find(c=>c.id===state.shareId);if(state.shareId.startsWith('own-')){const l=listById(state.shareId.slice(4));const snap=state.publicSnapshots[l?.id];if(l?.published&&snap)c={id:state.shareId,title:snap.title,description:snap.description,items:snap.items,date:'10月02日',own:true};}if(state.scene==='gone'||!c)return `<div class="public-content" style="padding-top:85px">${emptyView('此分享链接已失效或不存在','链接可能已被取消，或当前无法访问。你可以继续浏览其他公开清单。',button('浏览 Hub','compass','nav','data-target="#hub"','primary'),'shield')}</div>`;if(state.scene==='loading'||state.scene==='error')return `<div class="public-content">${sceneView('public')}</div>`;const rlist=c.items.map(repoById).filter(r=>r&&!r.private);return `<div class="public-content"><a href="#hub" class="row small muted gap8">${ic('back','small')}返回 Hub</a><section class="public-head mt24"><div class="row between wrap"><div class="row gap8">${badge('公开分享','green','globe')}${badge('独立快照')}</div>${button(state.auth?'复制到我的列表':'登录后复制到我的列表','plus','import-public',`data-id="${c.id}" ${offlineAttrs()}`,'primary')}</div><h1>${esc(c.title)}</h1><p>${esc(c.description)}</p><div class="public-meta"><span class="row gap8">${ic('folder','small')}${rlist.length+(c.id==='s1'?1:0)} 个条目</span><span class="row gap8">${ic('clock','small')}${c.date} 更新</span><span>不会跟随作者后续编辑自动更新</span></div></section>${state.offline?'<div class="notice warning">'+ic('wifiOff')+'<span>当前为离线演示。正式产品的公开快照需要联网访问。</span></div>':''}${rlist.map(r=>`<article class="public-item">${repoMark(r)}<div class="grow"><h3><a href="https://github.com/${esc(r.owner+'/'+r.name)}" target="_blank" rel="noopener noreferrer">${esc(r.owner+'/'+r.name)}</a></h3><p>${esc(r.description)}</p><div class="row muted tiny mt8" style="gap:13px"><span class="row gap8"><span class="lang-dot" style="background:${languageColors[r.language]}"></span>${r.language}</span><span>${ic('star','small')} ${totalText(r.stars)}</span></div></div><a class="btn icon ghost" href="https://github.com/${esc(r.owner+'/'+r.name)}" target="_blank" rel="noopener noreferrer" aria-label="在来源平台打开 ${esc(r.name)}">${ic('external')}</a></article>`).join('')}${c.id==='s1'?`<div class="public-item unavailable">${ic('lock','large')}<div class="grow"><h3>仓库不可用</h3><p>该条目当前无法公开展示。</p></div>${badge('不可用')}</div>`:''}<div class="public-foot"><span>分享仅展示公开仓库资料，个人备注与 AI 内容不在快照中。</span>${button('举报内容','alert','report',`data-id="${c.id}" ${offlineAttrs()}`,'ghost sm')}</div><div class="footer-note"><span>由 GitStars 整理与分享</span><span>全部内容与统计均为演示数据</span></div></div>`}
function home(){return `<div class="login-layout"><section class="login-copy"><h1>为开源收藏，<br>留一个好位置。</h1><p>将 GitHub Stars 与 Forks 整理成可检索的收藏库。用主题列表、个人备注和 AI 摘要，把“以后再看”变成“随时可用”。</p><div class="login-benefits"><span class="row">${ic('search')}一个入口，搜索收藏与自己的整理</span><span class="row">${ic('folder')}按主题归类，按需导出与分享</span><span class="row">${ic('note')}记录判断，保留真正有用的线索</span></div>${state.scene==='error'?'<div class="notice error">'+ic('alert')+'<span>授权未完成。可以重新登录，或先浏览公开列表。</span></div>':''}<div class="row wrap">${button('使用 GitHub 登录','github','sign-in','','primary')}${button('先浏览公开列表','compass','nav','data-target="#hub"','ghost')}</div>${state.demoDev?'<div class="mt16">'+button('以演示开发用户进入','','sign-in','','sm')+'<span class="tiny muted"> 仅演示开发登录</span></div>':''}<p class="tiny" style="margin-top:18px;font-size:11px">个人列表默认私有。发布分享快照与加入 Hub 都由你主动选择。</p></section><section class="login-preview" aria-label="收藏工作台示例"><div class="login-preview-head"><span class="row">${ic('library')}你的收藏库</span>${badge('界面示例')}</div>${[repositories[0],repositories[2],repositories[8]].map(r=>`<div class="preview-row">${repoMark(r)}<div class="grow"><h3>${r.owner} / ${r.name}</h3><p>${r.tags.join(' · ')}</p></div>${ic('bookmarkCheck')}</div>`).join('')}<div class="login-preview-foot">${ic('folder','small')}Agent 工具箱<span class="muted" style="margin-left:auto">6 个仓库</span></div></section></div><div class="login-foot">GitStars · 个人开源收藏工作台 <span style="margin:0 8px">·</span> 离线设计原型，不连接真实账号</div>`}
function recovery(){const unsupported=state.scene==='unsupported';return `<div class="recovery-wrap"><section class="recovery"><span class="hub-mark sand">${ic('shield','large')}</span><h1>${unsupported?'这份缓存来自更高版本':'本地缓存暂时无法读取'}</h1><p>${unsupported?'建议先更新 GitStars。重置缓存前，可以尝试导出尚未同步的修改。':'服务器上的数据不受影响。本地还有尚未同步的修改，请先导出备份，再决定是否重置缓存。'}</p><div class="recovery-fact"><span class="muted">服务器数据</span>${badge('不会被重置','green')}</div><div class="recovery-fact"><span class="muted">未同步修改</span><span class="number">${state.pending||3} 条 · 演示值</span></div><div class="stack">${button('导出待同步修改','download','export-pending','','primary')}${button('重置本地缓存','trash','reset-cache','','danger')}${button('返回工作台','back','exit-recovery','','ghost')}</div><p class="tiny" style="margin-bottom:0">如果无法确定队列是否完整，请优先保留现有缓存。</p></section></div>`}
function notFound(){return `<section class="notfound"><div class="error-code">404</div><h1>这个页面暂时找不到</h1><p>链接可能已经变更，或地址输入有误。<br>从收藏库或 Hub 继续浏览。</p><div class="row wrap" style="justify-content:center">${button('返回收藏库','library','nav','data-target="#library"','primary')}${button('浏览 Hub','compass','nav','data-target="#hub"')}</div></section>`}
function render(){
captureAiDraft();
if(!state.auth&&['library','lists','repository','settings','recovery'].includes(state.route)){state.returnHash=location.hash||'#library';state.route='home'}
const active=document.activeElement;const owned=active&&$('#app').contains(active);const focusAttrs=owned?['id','data-bind','data-select','data-action','data-id','data-value'].filter(k=>active.hasAttribute(k)).map(k=>[k,active.getAttribute(k)]):[];const focusContext=owned?active.closest('.sidebar,.filter-pop,.tag-strip,.topbar,.settings-nav')?.classList[0]:null;const caret=owned?active.selectionStart:null;const scrollY=window.scrollY;
const body=state.route==='library'?library():state.route==='lists'?listsPage():state.route==='hub'?hub():state.route==='settings'?settings():state.route==='repository'?reader():state.route==='s'?publicList():state.route==='home'?home():state.route==='recovery'?recovery():notFound();const isPublic=!state.auth||state.route==='home'||state.route==='s'||state.route==='recovery';$('#app').innerHTML=isPublic?publicShell(state.route==='hub'?`<div class="public-content" style="max-width:1240px">${body}</div>`:body):shell(body);document.title='GitStars · '+(routeNames[state.route]||({s:'公开分享',home:'欢迎使用',recovery:'缓存恢复'})[state.route]||'页面不存在');
syncMenuAccess();
if(focusAttrs.length&&!$('#dialog')?.open){const root=focusContext?$('.'+focusContext)||$('#app'):$('#app');const el=$$('button,input,select,textarea,a',root).find(n=>n.tagName===active.tagName&&focusAttrs.every(([k,v])=>n.getAttribute(k)===v));if(el&&!el.disabled&&!el.closest('[inert]')){el.focus({preventScroll:true});if(typeof caret==='number'&&(el.tagName==='TEXTAREA'||['text','search','password'].includes(el.type)))el.setSelectionRange(caret,caret)}}window.scrollTo(0,scrollY);
}
function syncMenuAccess(){const small=matchMedia('(max-width:560px)').matches;const side=$('.sidebar');if(side){side.inert=small&&!state.menuOpen;side.setAttribute('aria-hidden',String(small&&!state.menuOpen));side.classList.toggle('open',state.menuOpen);if(small&&state.menuOpen){side.setAttribute('role','dialog');side.setAttribute('aria-modal','true')}else{side.removeAttribute('role');side.removeAttribute('aria-modal')}}$('.mobile-scrim')?.classList.toggle('open',state.menuOpen);const space=$('.workspace');if(space)space.inert=small&&state.menuOpen;$('[data-action="toggle-menu"]')?.setAttribute('aria-expanded',String(state.menuOpen));document.body.classList.toggle('menu-open',small&&state.menuOpen)}
function setMenu(open){state.menuOpen=open;syncMenuAccess();if(open)$('.sidebar a')?.focus();else $('[data-action="toggle-menu"]')?.focus()}
matchMedia('(max-width:560px)').addEventListener('change',()=>{state.menuOpen=false;syncMenuAccess()});

let returnFocus=null;let dialogCleanup=null;let toastTimer=null;let noteTimer=null;let batchTimer=null;let undoAction=null;
function openDialog(title,body,foot='',drawer=false,wide=false){const priorFocus=document.activeElement;closeDialog();returnFocus=priorFocus;$('#overlay-root').innerHTML=`<dialog id="dialog" class="${drawer?'drawer':''} ${wide?'wide':''}" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title">${title}</h2>${iconButton('关闭面板','close','close-dialog','','ghost')}</header><div class="dialog-body">${body}</div>${foot?`<footer class="dialog-foot">${foot}</footer>`:''}</dialog>`;const d=$('#dialog');d.showModal();d.addEventListener('close',()=>{if($('#dialog')!==d)return;if(dialogCleanup){dialogCleanup();dialogCleanup=null}$('#overlay-root').innerHTML='';const target=returnFocus;returnFocus=null;if(target?.isConnected)target.focus({preventScroll:true});else $('#main-content')?.focus({preventScroll:true})});d.addEventListener('click',e=>{if(e.target===d){const b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}});requestAnimationFrame(()=>{$('[data-autofocus]',d)?.focus()});}
function closeDialog(){const d=$('#dialog');if(d?.open)d.close();else if(d)$('#overlay-root').innerHTML='';}
function toast(message,undo=null){clearTimeout(toastTimer);undoAction=undo;$('#toast-container').innerHTML=`<div class="toast">${ic('check')}<span>${esc(message)}</span>${undo?'<button data-action="undo">撤销</button>':''}</div>`;toastTimer=setTimeout(()=>{$('#toast-container').innerHTML='';undoAction=null},undo?8500:4500)}
function download(name,data,type='application/json'){const b=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('已导出演示文件')}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch{openDialog('复制内容',`<p>浏览器未开放剪贴板权限，可以选择下方内容手动复制。</p><textarea class="field mono" readonly data-autofocus>${esc(text)}</textarea>`,button('完成','','close-dialog','','primary'));$('[data-autofocus]')?.select()}}
function markPending(){if(state.offline)state.pending++;}
function membershipDialog(ids){openDialog(ids.length===1?'加入列表':'把 '+ids.length+' 个仓库加入列表',`<p>一个仓库可以属于多个列表。这里的快捷加入操作需要联网。</p><div class="check-list">${lists.map(l=>`<label><input type="checkbox" data-membership="${l.id}" ${ids.every(id=>l.items.includes(id))?'checked':''}><span>${esc(l.name)}</span><span class="muted tiny number">${l.items.length}</span></label>`).join('')}</div>`,button('取消','','close-dialog')+button('保存','check','save-membership',`data-ids="${ids.join(',')}"`,'primary'));}
function createListDialog(editId=''){const l=editId?listById(editId):null;openDialog(l?'修改列表':'新建列表',`<p>${l?'清晰的名称和描述有助于查找与智能归类。':'给同一主题的仓库一个位置。新列表默认仅自己可见。'}</p><label class="field-label">列表名称<input class="field" id="list-name" value="${esc(l?.name||'')}" maxlength="100" placeholder="例如：Agent 工具箱" data-autofocus></label><label class="field-label mt16">描述<textarea class="field" id="list-description" placeholder="这个列表会收录什么？">${esc(l?.description||'')}</textarea><span class="hint">智能归类会参考这段描述。</span></label><div id="list-form-error" class="small mt8" role="status" style="color:var(--red)"></div>`,button('取消','','close-dialog')+button(l?'保存修改':'创建列表','check','commit-list',`data-id="${editId}"`,'primary'));}
function shareDialog(id){const l=listById(id);if(!l)return;const pub=l.items.filter(id=>!repoById(id)?.private).length;openDialog('分享「'+esc(l.name)+'」',`<p>分享会生成一个独立的公开快照。列表后续变化不会自动更新到分享页。</p><div class="draft-summary"><span>可公开 ${pub} 项</span><span>排除私有 ${l.items.length-pub} 项</span></div><div class="notice">${ic('shield')}<span>快照只含公开仓库资料。个人备注、AI 摘要和 AI 标签不会公开。</span></div>${l.published?`<label class="field-label">分享链接<div class="key-wrap"><input class="field" readonly id="share-link" value="${esc(location.href.split('#')[0]+'#s/own-'+l.id)}">${iconButton('复制分享链接','copy','copy-share',`data-id="${l.id}"`)}</div></label><a class="btn sm mt16" href="#s/own-${l.id}" data-action="close-and-follow">${ic('external')}预览公开快照</a><div class="setting-row mt16"><div><h3>显示到 Hub 广场</h3><p>让这份公开快照出现在 Hub 中。默认关闭。</p></div><button class="switch ${l.hub?'on':''}" role="switch" aria-checked="${l.hub}" aria-label="将快照显示到 Hub" data-action="toggle-hub" data-id="${l.id}"></button></div><p class="tiny muted mt16">快照 v${l.snapshotVersion} · 需要手动更新</p>`:`<div class="compare-box"><h3>尚未发布</h3><p class="muted mt8">只有生成公开快照后，其他人才能通过链接查看。加入 Hub 是单独的选择。</p></div>`}`,l.published?button('取消分享','trash','revoke-share',`data-id="${l.id}"`,'danger')+button('更新快照','sync','publish-share',`data-id="${l.id}"`,'primary'):button('取消','','close-dialog')+button('生成公开快照','share','publish-share',`data-id="${l.id}"`,'primary'));}
function syncPanel(){openDialog('同步状态',`<div class="row between"><span class="row gap8"><span class="dot ${state.offline?'amber':''}"></span>${state.offline?'离线模式':'连接正常'}</span>${badge(state.pending?state.pending+' 条待同步':'全部已同步',state.pending?'amber':'green')}</div><div class="status-list"><div class="status-event">${ic('github')}<div><h3>GitHub 收藏同步</h3><p>上次完成于 2 分钟前。同步 Star 与 Fork 资料。</p></div></div>${state.pending?Array.from({length:Math.min(state.pending,4)},(_,i)=>`<div class="status-event">${ic('note')}<div class="grow"><h3>${i===0?'个人备注已更改':i===1?'列表成员已更改':'标签已更改'}</h3><p>保存在本地 · 联网后等待同步</p></div>${badge('待同步','amber')}</div>`).join(''):`<div class="status-event">${ic('check')}<div><h3>本地修改已经同步</h3><p>没有等待上传的更改。</p></div></div>`}</div><div class="compare-box"><h3>出现版本冲突？</h3><p class="muted mt8">查看差异再处理，避免覆盖另一台设备的修改。</p>${button('查看冲突示例','layers','conflict-example','','ghost sm mt8')}</div>`,button('导出待同步修改','download','export-pending','','sm')+button('立即同步','sync','sync-now',offlineAttrs(),'primary'),true);}
function demoPanel(){openDialog('演示场景',`<p>这个面板只存在于示范文件。页面内容、账号、统计与交互结果均为演示值，不会访问真实服务。</p><label class="field-label">页面<select class="field" id="demo-page" data-autofocus>${[['library','收藏库'],['lists','我的列表'],['hub','Hub 广场'],['repository/r1','仓库阅读'],['settings','设置'],['s/s1','公开分享'],['home','登录页'],['notfound','404'],['recovery','缓存恢复']].map(([v,l])=>`<option value="${v}" ${state.route===v||v.startsWith(state.route+'/')?'selected':''}>${l}</option>`).join('')}</select></label><div class="small muted mt24 mb16">选择状态</div>${[['normal','正常内容','检查页面布局、主要操作与导航。','grid'],['empty','空状态','收藏库、我的列表与 Hub 的首次使用引导。','bookmark'],['loading','加载状态','结构化骨架屏；切换正常状态后结束。','clock'],['error','加载失败','错误说明、重试入口与恢复操作。','alert'],['offline','离线模式','本地编辑与待同步状态；联网操作被禁用。','wifiOff'],['anonymous','匿名访问','公开 Hub 与分享页；复制前返回登录。','globe'],['gone','分享失效','统一的不可访问反馈，不暴露私有详情。','lock'],['long','长内容','收藏库里的长仓库名称与布局压力测试。','file'],['unsupported','缓存版本不兼容','优先升级或备份，再考虑重置。','shield']].map(([v,l,d,i])=>`<button class="state-option ${state.scene===v?'active':''}" data-action="apply-scene" data-value="${v}">${ic(i)}<span class="grow">${l}<p>${d}</p></span>${state.scene===v?ic('check'):''}</button>`).join('')}<div class="setting-row"><div><h3>显示开发登录示例</h3><p>正式产品仅在后端允许开发登录时显示。</p></div><button class="switch ${state.demoDev?'on':''}" role="switch" aria-label="显示开发登录示例" aria-checked="${state.demoDev}" data-action="toggle-dev"></button></div>`,button('恢复正常演示','sync','reset-scene','','primary'),true);}

function importDialog(){state.importDraft=null;openDialog('导入列表',`<p>先预览，再确认导入。支持 .gitstars-list.json 文件或粘贴便携清单内容。</p><label class="field-label">选择文件<input class="field" id="import-file" type="file" accept=".json,application/json"></label><label class="field-label mt16">或粘贴 JSON<textarea class="field mono" id="import-text" style="min-height:170px" placeholder="{ &quot;format&quot;: &quot;gitstars-list&quot;, ... }"></textarea></label>${button('填入演示清单','file','fill-import','','ghost sm mt8')}<div id="import-preview" class="mt16" aria-live="polite"></div>`,button('取消','','close-dialog')+button('预览导入','search','preview-import','','primary'));}
function showImportPreview(){const text=$('#import-text').value;try{const d=JSON.parse(text);if(d.format!=='gitstars-list'||d.schema_version!==0||!Array.isArray(d.items)||typeof d.title!=='string'||!d.title.trim())throw new Error('需要有效的 gitstars-list（schema_version: 0）清单。');const forbidden=['id','user_id','uuid','token','access_token','sync_state','version','repository_id','saved_repository_id'];let hasForbidden=false;const scan=o=>{if(!o||typeof o!=='object')return;for(const [k,v] of Object.entries(o)){if(forbidden.includes(k))hasForbidden=true;scan(v)}};scan(d);if(hasForbidden)throw new Error('文件包含凭据或内部标识，不能导入。');if(d.items.some(x=>!x.source||!x.source.provider||!x.source.host||!x.source.remote_id))throw new Error('仓库来源需包含 provider、host 和 remote_id。');const resolved=d.items.map(x=>repositories.find(r=>r.owner+'/'+r.name===x.source?.path&&!r.private)).filter(Boolean);state.importDraft={doc:d,ids:[...new Set(resolved.map(r=>r.id))]};$('#import-preview').innerHTML=`<h3>${esc(d.title)}</h3><div class="draft-summary"><span>${resolved.length} 项可加入</span><span>${d.items.length-resolved.length} 项未解析</span><span>${resolved.length-state.importDraft.ids.length} 项重复</span></div><p class="small muted">原型仅解析现有演示仓库，不会访问来源平台。</p>`;$('.dialog-foot').innerHTML=button('返回编辑','','import-edit')+button('确认导入','check','commit-import','','primary');}catch(e){$('#import-preview').innerHTML=`<div class="notice error">${ic('alert')}<span>${esc(e.message||'JSON 格式有误。')}</span></div>`}}
function beginBatch(ids){closeDialog();const targets=ids.map(repoById).filter(Boolean);if(!targets.length){toast('没有需要处理的仓库');return}state.batch={total:targets.length,done:0,failed:0,paused:false,ids:targets.map(r=>r.id)};render();runBatchTick()}
function runBatchTick(){clearTimeout(batchTimer);if(!state.batch||state.batch.paused)return;batchTimer=setTimeout(()=>{if(!state.batch||state.batch.paused)return;const b=state.batch;rApplySummary(b.ids[b.done]);b.done++;if(b.done===b.total){toast('演示摘要已完成，共 '+b.total+' 项');state.batch=null;render()}else{render();runBatchTick()}},500)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){if(el.tagName==='BUTTON'&&!el.type)el.type='button';if(el.dataset.action!=='close-and-follow'&&el.dataset.action!=='scroll-section')e.preventDefault();handleAction(el,e)}else if(state.filterOpen&&!e.target.closest('.filter-wrap')&&!e.target.closest('dialog')){state.filterOpen=false;render()}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.select){if(t.checked)state.selected.add(t.dataset.select);else state.selected.delete(t.dataset.select);render()}else if(t.dataset.bind&&t.tagName==='SELECT'){state[t.dataset.bind]=t.value;state.selected.clear();render()}else if(t.id==='ai-provider'){const base={OpenRouter:'https://openrouter.ai/api/v1',OpenAI:'https://api.openai.com/v1',Anthropic:'https://api.anthropic.com','Google Gemini':'https://generativelanguage.googleapis.com',DeepSeek:'https://api.deepseek.com','自定义兼容服务':'https://example.com/v1'};$('#ai-base').value=base[t.value];$('#ai-model').value='demo-model';$('#model-status').textContent='厂商已切换，请核对对应配置。'}else if(t.id==='import-file'&&t.files[0]){if(t.files[0].size>2*1024*1024){toast('演示文件请控制在 2MB 以内');return}$('#import-text').value=await t.files[0].text()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind&&t.tagName==='INPUT'){state[t.dataset.bind]=t.value;if(state.route==='library')state.selected.clear();render()}else if(t.id==='command-query'){updateCommand(t.value)}else if(t.id==='add-search'){$$('[data-candidate]').forEach(el=>el.classList.toggle('hidden',!el.dataset.candidate.toLowerCase().includes(t.value.toLowerCase())))}else if(t.dataset.note){const r=repoById(t.dataset.note);r.note=t.value;clearTimeout(noteTimer);$('#note-save-status').innerHTML=ic('clock','small')+'正在保存…';noteTimer=setTimeout(()=>{markPending();const status=$('#note-save-status');if(status)status.innerHTML=ic('check','small')+(state.offline?'已保存到本地，待同步':'已保存到演示会话')},450)}else if(t.id==='delete-token'){$('#delete-account-button').disabled=t.value!=='demo-confirm-2026'}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ai-form'){const key=$('#ai-key').value.trim(),base=$('#ai-base').value.trim(),model=$('#ai-model').value.trim();if(!key||!base||!model){$('#ai-validation').textContent='请填写 API Key、Base URL 和模型名。';(!key?$('#ai-key'):!base?$('#ai-base'):$('#ai-model')).focus();return}try{const u=new URL(base);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{$('#ai-validation').textContent='请使用有效的 HTTP 或 HTTPS 地址。';$('#ai-base').focus();return}$('#ai-validation').textContent='';toast('配置已校验（演示），密钥未保存')}else if(e.target.id==='discover-form'){const q=$('#discover-query').value.trim().toLowerCase();const rs=repositories.filter(r=>!r.private&&(r.name.toLowerCase().includes(q)||r.description.toLowerCase().includes(q)||q==='backend'&&r.tags.includes('后端服务'))).slice(0,5);$('#discover-results').innerHTML=q?(rs.length?rs.map(r=>`<div class="dialog-item">${repoMark(r)}<div class="grow"><h3>${esc(r.owner+'/'+r.name)}</h3><p>${esc(r.description)}</p></div>${r.saved?badge('已收藏','green'):button('收藏','plus','save-discovery',`data-id="${r.id}"`,'sm')}</div>`).join('')+`<div class="dialog-item"><span class="repo-emblem">EX</span><div class="grow"><h3>sample-tools / uncached-example</h3><p>合成的未索引搜索结果。先在来源平台收藏，再同步到 GitStars。</p></div>${button('仅可查看','external','noop','disabled','sm')}</div>`:'<div class="compare-box">没有匹配的演示仓库。</div>'):'<p class="muted small">先输入搜索词。</p>'}});
document.addEventListener('keydown',e=>{const input=e.target.closest('input,textarea,select,[contenteditable=true]');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandDialog()}else if(e.key==='/'&&!input&&!$('#dialog')){e.preventDefault();const el=$('#library-search');if(el)el.focus();else{go('#library');setTimeout(()=>$('#library-search')?.focus(),40)}}else if(e.key==='Escape'&&!$('#dialog')){if(state.filterOpen){state.filterOpen=false;render();$('[data-action="toggle-filters"]')?.focus()}if(state.menuOpen)setMenu(false)}else if(e.key==='Tab'&&state.menuOpen&&matchMedia('(max-width:560px)').matches&&!$('#dialog')){const items=$$('a,button:not(:disabled)', $('.sidebar'));const i=items.indexOf(document.activeElement);if((e.shiftKey&&i<=0)||(!e.shiftKey&&i===items.length-1)){e.preventDefault();items[e.shiftKey?items.length-1:0]?.focus()}}else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.getAttribute('role')==='tab'){e.preventDefault();const ts=['readme','files','releases'];const i=ts.indexOf(state.readerTab);state.readerTab=ts[(i+(e.key==='ArrowRight'?1:2))%3];render();$('#tab-'+state.readerTab)?.focus()}else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&$('#command-results')){const items=$$('.command-item');if(items.length){e.preventDefault();const i=items.indexOf(document.activeElement);items[e.key==='ArrowDown'?(i+1)%items.length:(i-1+items.length)%items.length].focus()}}});
